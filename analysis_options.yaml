# Lint rules: https://dart.dev/tools/linter-rules
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by build_runner (freezed / json_serializable).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Freezed's generated JsonKey placement.
    invalid_annotation_target: ignore

linter:
  rules:
